[project]
name = "prism-ml"
version = "0.3.0"
description = "PRISM current thermal-status classification pipeline, insights and API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`:DeprecationWarning"]
